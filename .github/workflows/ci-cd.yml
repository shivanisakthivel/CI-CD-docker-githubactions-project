name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devops-cicd-app .

      - name: Run Docker Container
        run: docker run -d -p 8080:80 --name cicd-test devops-cicd-app

      - name: Test Website
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080; then
              echo "Website test successful!"
              exit 0
            fi
            sleep 3
          done
          echo "Website test failed!"
          exit 1

      - name: Stop Test Container
        if: always()
        run: docker rm -f cicd-test || true

  push-to-dockerhub:
    name: Push Image to Docker Hub
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-cicd-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-cicd-app:${{ github.sha }}
